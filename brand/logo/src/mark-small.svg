<?xml version="1.0" encoding="UTF-8"?>
<!-- The mark for 24 px and below: the same drawing, heavier, with a larger
     element and a shorter aerial so the gap to it survives being two pixels
     wide. Use mark.svg above 24 px; this one looks clumsy large. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
<style>.p{stroke:#4fd1e8;fill:none}.s{stroke:#e8eef5;fill:none}.pf{fill:#4fd1e8;stroke:none}</style>
<rect width="48" height="48" fill="#0a0e13"/>
<g id="glyph" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
  <path class="s" d="M10.5 43 V30 L22 18.5 L33.5 30 V43"/>
  <path class="p" d="M22 18.5 L29.5 11"/>
  <circle class="pf" cx="34" cy="6.5" r="5"/>
</g>
</svg>
